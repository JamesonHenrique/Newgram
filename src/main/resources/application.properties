spring.application.name=Newgram

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Flyway (baseline desligado: schema versionado do zero via V1..Vn)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Upload (32MB acomoda vídeos curtos de reels)
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB

# JWT (access curto + refresh longo com rotacao; segredo via env, nunca commitado)
jwt.secret=${JWT_SECRET:}
jwt.access.expiration=900000
jwt.refresh.expiration=604800000
jwt.clock-skew-seconds=60
jwt.issuer=newgram

# AWS (SDK v2; em EC2/ECS prefira IAM role omitindo as chaves)
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:}
aws.s3.presigned-url-expiration-minutes=60
aws.s3.connection-timeout-seconds=10
aws.s3.socket-timeout-seconds=30
aws.s3.max-connections=50

# CORS (origens extras via env, separadas por virgula)
app.cors.allowed-origins=http://localhost:4200,https://newgram-nine.vercel.app,${APP_CORS_EXTRA:}

# URL base do front (links de recuperacao de senha)
app.front-url=${APP_FRONT_URL:http://localhost:4200}

# Web Push VAPID (gere com `openssl ecparam -genkey -name prime256v1 -noout -out vapid.key`
# e extraia; sem elas, par efemero so para desenvolvimento)
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:contato@newgram.example.com}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Jackson (UTC consistente)
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Erros: nunca expor stack/message interna por padrao
server.error.include-message=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework

# Logging (sem TRACE de bind em prod: vaza PII)
logging.level.org.hibernate.SQL=WARN
logging.level.com.jhcs.newgram=INFO
