<div class="post-detail-comments">
  <h3 class="base-semibold mb-4">Comentários</h3>

  <div *ngFor="let comentario of comentariosSelected" class="comment">
    <img
      [src]="getFotoPerfil(comentario) "
      (error)="handleFotoPerfilError($event)"
      alt="Avatar do Usuário"
      class="w-10 h-10 rounded-full object-cover "
    />
    <div>
      <div class="flex gap-2 items-center">
        <h4 class="base-semibold">{{ comentario.autor.nome }}</h4>
        <span class="small-medium text-light-3">{{
          comentario.dataCriacao | dateFormat
        }}</span>
      </div>
      <p class="base-medium">
        {{ comentario.texto }}
      </p>
      <button
        type="button"
        class="flex items-center gap-1 text-light-3 hover:text-red text-xs mt-1"
        (click)="toggleCurtidaComentario(comentario, $event)"
      >
        <i
          class="fa-heart"
          [ngClass]="{ fas: comentario.curtidoPeloUsuario, far: !comentario.curtidoPeloUsuario }"
        ></i>
        <span>{{ comentario.numeroCurtidas || 0 }}</span>
      </button>
      <div class="flex gap-3 mt-1">
        <button
          *ngIf="comentario.numeroRespostas"
          type="button"
          class="text-xs text-gray-500"
          (click)="alternarRespostas(comentario, $event)"
        >
          {{ respostasVisiveis[comentario.id] ? 'Ocultar' : 'Ver' }} respostas ({{ comentario.numeroRespostas }})
        </button>
        <button
          type="button"
          class="text-xs text-gray-500"
          (click)="responder(comentario, $event)"
        >
          Responder
        </button>
      </div>
      <div *ngIf="respostasVisiveis[comentario.id]" class="ml-6 mt-2 space-y-2">
        <div *ngFor="let resposta of respostasVisiveis[comentario.id]" class="text-sm">
          <span class="font-semibold">{{ resposta.autor?.username || resposta.username }}</span>
          <span class="base-medium ml-2">{{ resposta.texto }}</span>
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="comentariosSelected.length === 0"
    class="text-light-3 small-medium"
  >
    Nenhum comentário ainda. Seja o primeiro a comentar!
  </div>
</div>

<div class="comment-input">
  <img
    [src]="getFotoPerfil()"
    (error)="handleFotoPerfilError($event)"
    alt="Seu Avatar"
    class="w-12 h-12 rounded-full object-cover"
  />
  <input
    type="text"
    [(ngModel)]="comentarioTexto"
    [placeholder]="responderA ? 'Responder ' + (responderA.autor?.username || responderA.username) + '...' : 'Adicione um comentário...'"
    class="comment-input-field"
    (keyup.enter)="enviarComentario()"
  />
  <button *ngIf="responderA" type="button" class="text-xs text-gray-500" (click)="cancelarResposta()">
    Cancelar
  </button>
  <button class="btn-icon" (click)="enviarComentario()">
    <i class="fas fa-paper-plane icon-custom"></i>
  </button>
</div>
