<div class="modal-overlay" [class.active]="isOpen" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Criar novo destaque</h3>
      <button class="close-btn" (click)="closeModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="highlight-name">Nome do destaque</label>
        <input
          type="text"
          id="highlight-name"
          [(ngModel)]="nome"
          placeholder="Ex: Viagens 2023"
          maxlength="20"
          #nameInput="ngModel"
        />
        <span class="char-counter">{{ nome.length }}/20</span>
        <div
          *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)"
          class="error-message"
        >
          <div *ngIf="nameInput.errors?.['required']">
            O nome do destaque é obrigatório
          </div>
        </div>
      </div>

      <div class="cover-section">
        <h4>Capa do destaque</h4>
        <div class="cover-preview" (click)="onFileSelected($event)">
          <img
            [src]="getCoverImageUrl()"
            alt="Preview da capa"
            *ngIf="getCoverImageUrl()"
            
          />
          <div class="cover-edit-hint">
            <div class="file-upload">
              <label for="cover-upload">
                <i class="fas fa-upload"></i>
                <span>Alterar capa</span>
                <input
                  id="cover-upload"
                  type="file"
                  accept="image/*"
                  #coverUpload
                  (change)="onFileSelected($event)"
                  style="display: none"
                />
              </label>

            </div>
          </div>
        </div>

        <div class="cover-options" [class.active]="showCoverOptions">
          <div
            class="cover-option"
            (click)="setCoverFromStory(selectedStories[0])"
          >
            <span>Usar primeira story</span>
          </div>
          <div
            class="cover-option"
            *ngFor="let storyId of selectedStories"
            (click)="setCoverFromStory(storyId)"
          >
            <span>Usar story {{ storyId }}</span>
          </div>
          <div class="cover-option file-upload">
            <label for="cover-upload">
              <i class="fas fa-upload"></i>
              <span>Enviar imagem</span>
              <input
                id="cover-upload"
                type="file"
                accept="image/*"
                (change)="onFileSelected($event)"
                style="display: none"
              />
            </label>
          </div>
        </div>
      </div>

      <div class="stories-selection">
        <h4>Selecione stories para incluir</h4>
        <div class="stories-grid">
          <div
            *ngFor="let story of availableStories"
            class="story-item"
            [class.selected]="isStorySelected(story.id)"
            (click)="toggleStorySelection(story.id)"
          >
            <img [src]="story.storieImagemUrl" alt="Story" />
            <div class="selection-check">
              <i class="fas fa-check"></i>
            </div>
            <div class="cover-badge" *ngIf="coverImage === story.id">
              <i class="fas fa-bookmark"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button
        class="create-btn"
        [disabled]="
          !nome.trim() || selectedStories.length === 0 || coverImage === null || nameInput.invalid
        "
        (click)="criarDestaque()"
      >
        Criar
      </button>
    </div>
  </div>
</div>
