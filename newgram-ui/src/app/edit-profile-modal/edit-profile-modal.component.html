<div class="modal-overlay" [class.active]="isOpen">
  <div class="edit-profile-modal animate__fadeIn animate__animated">
    <div class="modal-header">
      <h2>Editar Perfil</h2>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>

    <div class="modal-content">
      <div class="avatar-section">
        <div class="current-avatar">
          <h4>Foto atual</h4>
          <img [src]="userProfile?.fotoPerfil || '/icons/profile-placeholder.svg'"
               alt="Current Avatar"
               class="avatar-preview">
        </div>

        <div class="new-avatar" *ngIf="newProfileImage">
          <h4>Nova foto</h4>
          <img [src]="newProfileImage"
               alt="New Avatar"
               class="avatar-preview">
        </div>

        <label class="upload-btn">
          <input type="file"
                 accept="image/*"
                 (change)="handleImageUpload($event)"
                 hidden>
          <i class="fas fa-camera"></i> Alterar Foto
        </label>

      </div>

      <form class="profile-form" (submit)="updateProfile()" [formGroup]="editForm">
        <div class="form-group">
          <label>Nome</label>
          <input type="text"
                 formControlName="nome"
                 name="nome"
                 required>
        </div>

        <div class="form-group">
          <label>Username</label>
          <input type="text"
                 formControlName="username"
                 name="username"
                 required>
        </div>

        <div class="form-group">
          <label>Bio</label>
          <textarea
                 formControlName="bio"
                    name="bio"
                    rows="3"></textarea>
        </div>

        <div class="form-group">
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="checkbox"
              [checked]="contaPrivada"
              (change)="alternarPrivacidade()"
            />
            <span>Conta privada (só seguidores aprovados veem posts e stories)</span>
          </label>
        </div>

        <div class="form-group">
          <label>Autenticação em dois fatores (2FA)</label>
          <div *ngIf="!twoFactorAtivo && !segredoTwoFactor">
            <button type="button" class="cancel-btn" (click)="iniciarAtivacaoTwoFactor()">
              Ativar 2FA
            </button>
          </div>
          <div *ngIf="segredoTwoFactor && !twoFactorAtivo" class="space-y-2 mt-2">
            <p class="text-sm">Escaneie no app autenticador ou digite o segredo:</p>
            <code class="block p-2 bg-gray-700 rounded text-sm break-all">{{ segredoTwoFactor }}</code>
            <input
              type="text"
              [(ngModel)]="codigoTwoFactor"
              [ngModelOptions]="{ standalone: true }"
              maxlength="6"
              placeholder="Código de 6 dígitos"
              class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-sm"
            />
            <button type="button" class="save-btn" (click)="confirmarAtivacaoTwoFactor()">
              Confirmar e ativar
            </button>
          </div>
          <div *ngIf="twoFactorAtivo" class="mt-2">
            <span class="text-sm text-green-500">2FA ativo.</span>
            <button type="button" class="cancel-btn ml-2" (click)="desativarTwoFactor()">
              Desativar
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Conta de criador</label>
          <input
            type="text"
            [(ngModel)]="chavePix"
            [ngModelOptions]="{ standalone: true }"
            placeholder="Chave Pix para gorjetas (opcional)"
            class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-sm"
          />
          <select
            [(ngModel)]="tipoConta"
            [ngModelOptions]="{ standalone: true }"
            class="w-full p-2 mt-2 bg-gray-700 border border-gray-600 rounded text-sm"
          >
            <option value="PESSOAL">Pessoal</option>
            <option value="CRIADOR">Criador</option>
            <option value="NEGOCIOS">Negócios</option>
          </select>
          <button type="button" class="cancel-btn mt-2" (click)="salvarPixETipoConta()">
            Salvar Pix e tipo de conta
          </button>
        </div>

        <div class="form-group">
          <label>Verificação e dados (LGPD)</label>
          <div class="flex flex-wrap gap-2 mt-1">
            <button type="button" class="cancel-btn" (click)="solicitarVerificacao()">
              Solicitar selo de verificação
            </button>
            <button type="button" class="cancel-btn" (click)="exportarDados()">
              Exportar meus dados
            </button>
            <button
              type="button"
              class="cancel-btn"
              (click)="excluirConta()"
              [class.text-red-500]="confirmarExclusao"
            >
              {{ confirmarExclusao ? 'Clique de novo para confirmar a exclusão' : 'Excluir minha conta' }}
            </button>
          </div>
          <p *ngIf="sucessoMsg" class="text-sm text-green-500 mt-2">{{ sucessoMsg }}</p>
        </div>

        <div class="form-actions">
          <button type="button"
                  class="cancel-btn"
                  (click)="closeModal()">Cancelar</button>
          <button type="submit"
                  class="save-btn"
                  [disabled]="loading || !editForm.value.nome || !editForm.value.username">
            <span *ngIf="!loading">Salvar Alterações</span>
            <span *ngIf="loading">Salvando...</span>
          </button>
        </div>
        <div
        *ngIf="errorMessage"
        class="mt-6 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg text-red-600 dark:text-red-300"
      >
        <div class="flex items-center gap-2">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>
      </div>
      </form>
    </div>
  </div>
</div>
