<div class="content-area px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <h1 class="h2-bold mb-6 text-primary-500 animate-fadeIn">Explorar</h1>

    <!-- Search Container -->
    <div class="search-container relative mb-4 sm:mb-6 animate-slideUp">
      <i
        class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
      ></i>
      <input
        type="text"
        class="search-input w-full py-2 px-4 pl-10 text-sm sm:text-base rounded-lg border border-gray-600 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
        placeholder="Pesquisar posts, tags, pessoas..."
      />
    </div>

    <!-- Popular Tags -->
    <div class="mb-4 sm:mb-6 animate-slideUp" style="animation-delay: 0.1s">
      <h3 class="font-semibold mb-3 text-gray-300 text-sm sm:text-base">
        Tags Populares
      </h3>
      <div
        class="popular-tags flex overflow-x-auto pb-2 gap-2 scrollbar-thin scrollbar-thumb-gray-600 scrollbar-track-gray-800"
      >
        <span
          *ngFor="let tag of popularTags"
          class="tag whitespace-nowrap px-3 py-1 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm"
          >#{{ tag }}</span
        >
      </div>
    </div>

    <!-- Filter Tabs -->
    <div
      class="filter-tabs flex overflow-x-auto pb-2 mb-4 sm:mb-6 gap-2 sm:gap-3 scrollbar-thin scrollbar-thumb-gray-600 scrollbar-track-gray-800 animate-slideUp"
      style="animation-delay: 0.2s"
    >
      <div
        class="filter-tab active whitespace-nowrap px-3 py-1.5 bg-primary-500 text-white rounded-full text-xs sm:text-sm font-medium"
        data-filter="all"
      >
        Todos
      </div>
      <div
        class="filter-tab whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm font-medium hover:bg-gray-600"
        data-filter="trending"
      >
        Tendências
      </div>
      <div
        class="filter-tab whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm font-medium hover:bg-gray-600"
        data-filter="latest"
      >
        Mais Recentes
      </div>
      <div
        class="filter-tab whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm font-medium hover:bg-gray-600"
        data-filter="popular"
      >
        Mais Populares
      </div>
      <div
        class="filter-tab whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm font-medium hover:bg-gray-600"
        data-filter="following"
      >
        Seguindo
      </div>
    </div>

    <!-- Category Pills -->
    <div
      class="category-pills flex overflow-x-auto pb-2 gap-2 sm:gap-3 scrollbar-thin scrollbar-thumb-gray-600 scrollbar-track-gray-800 animate-slideUp"
      style="animation-delay: 0.3s"
    >
      <div
        class="category-pill active flex items-center whitespace-nowrap px-3 py-1.5 bg-primary-500 text-white rounded-full text-xs sm:text-sm gap-2"
        data-category="all"
      >
        <i class="fas fa-th-large text-xs sm:text-sm"></i>
        <span>Todos</span>
      </div>
      <div
        class="category-pill flex items-center whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm gap-2 hover:bg-gray-600"
        data-category="photography"
      >
        <i class="fas fa-camera text-xs sm:text-sm"></i>
        <span>Fotografia</span>
      </div>
      <div
        class="category-pill flex items-center whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm gap-2 hover:bg-gray-600"
        data-category="travel"
      >
        <i class="fas fa-plane text-xs sm:text-sm"></i>
        <span>Viagem</span>
      </div>
      <div
        class="category-pill flex items-center whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm gap-2 hover:bg-gray-600"
        data-category="food"
      >
        <i class="fas fa-utensils text-xs sm:text-sm"></i>
        <span>Comida</span>
      </div>
      <div
        class="category-pill flex items-center whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm gap-2 hover:bg-gray-600"
        data-category="art"
      >
        <i class="fas fa-palette text-xs sm:text-sm"></i>
        <span>Arte</span>
      </div>
      <div
        class="category-pill flex items-center whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm gap-2 hover:bg-gray-600"
        data-category="music"
      >
        <i class="fas fa-music text-xs sm:text-sm"></i>
        <span>Música</span>
      </div>
      <div
        class="category-pill flex items-center whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm gap-2 hover:bg-gray-600"
        data-category="tech"
      >
        <i class="fas fa-laptop text-xs sm:text-sm"></i>
        <span>Tecnologia</span>
      </div>
      <div
        class="category-pill flex items-center whitespace-nowrap px-3 py-1.5 bg-gray-700 text-gray-200 rounded-full text-xs sm:text-sm gap-2 hover:bg-gray-600"
        data-category="fashion"
      >
        <i class="fas fa-tshirt text-xs sm:text-sm"></i>
        <span>Moda</span>
      </div>
    </div>

    <!-- View Toggle -->
    <div
      class="flex-between mb-6 animate-slideUp"
      style="animation-delay: 0.4s"
    >
      <h3 class="base-semibold text-light-2">Resultados</h3>
      <div class="view-toggle">
        <div class="view-toggle-btn active" data-view="grid">
          <i class="fas fa-th-large"></i>
        </div>
        <div class="view-toggle-btn" data-view="list">
          <i class="fas fa-list"></i>
        </div>
      </div>
    </div>

    <section
      class="trending-section mb-4 sm:mb-8 animate-slideUp"
      style="animation-delay: 0.5s"
    >
      <div
        class="trending-header flex justify-between items-center mb-2 sm:mb-4"
      >
        <h3 class="font-semibold text-primary-custom text-sm sm:text-lg">
          Tendências
        </h3>
        <a
          href="#"
          class="text-xs sm:text-sm font-medium text-gray-400 hover:text-gray-100 transition-colors"
        >
          Ver Todos
        </a>
      </div>

      <div
        class="trending-posts grid grid-cols-1 xs:grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4"
      >
        <div
          *ngFor="let post of viralPosts; let i = index"
          (click)="openPostDetails(post, $event)"
          class="trending-post bg-gray-800 rounded-lg sm:rounded-xl overflow-hidden transition-transform hover:scale-[1.02] active:scale-[0.98]"
        >
          <label [for]="'modal-1'" class="cursor-pointer">
            <img
              [src]="post.image"
              alt="Post em Tendência"
              class="trending-post-img w-full h-32 xs:h-36 sm:h-40 md:h-48 object-cover"
            />

            <div class="trending-post-content p-2 sm:p-3 md:p-4">
              <div class="flex justify-between items-center mb-1 sm:mb-2">
                <div class="flex items-center gap-1 sm:gap-2">
                  <img
                    [src]="post.avatar"
                    alt="Avatar"
                    class="w-5 h-5 sm:w-6 sm:h-6 md:w-7 md:h-7 rounded-full object-cover"
                  />
                  <p
                    class="text-xs sm:text-sm font-medium text-gray-300 truncate max-w-[80px] xs:max-w-[100px] sm:max-w-none"
                  >
                    {{ post.author }}
                  </p>
                </div>
                <span
                  class="text-[10px] xs:text-xs font-semibold text-gray-400"
                >
                  {{ post.time }}
                </span>
              </div>

              <h4
                class="font-semibold text-gray-100 mb-1 text-xs sm:text-sm md:text-base line-clamp-2"
              >
                {{ post.text }}
              </h4>

              <div class="flex flex-wrap gap-1 sm:gap-2 mb-2">
                <span
                  *ngFor="let tag of post.tags.slice(0, 2)"
                  class="text-[10px] xs:text-xs font-semibold text-gray-400"
                >
                  #{{ tag }}
                </span>
              </div>

              <div class="flex justify-between items-center">
                <div class="flex gap-2 sm:gap-3 md:gap-4">
                  <span
                    class="flex items-center gap-1 text-gray-400 text-[10px] xs:text-xs sm:text-sm"
                  >
                    <i class="far fa-heart"></i>
                    <span>{{ formatNumber(post.likes) }}</span>
                  </span>
                  <span
                    class="flex items-center gap-1 text-gray-400 text-[10px] xs:text-xs sm:text-sm"
                  >
                    <i class="far fa-comment"></i>
                    <span>{{ formatNumber(post.comments) }}</span>
                  </span>
                </div>
                <i
                  class="far fa-bookmark text-gray-400 hover:text-primary-500 cursor-pointer text-xs sm:text-sm"
                ></i>
              </div>
            </div>
          </label>
        </div>
      </div>
    </section>

    <div>
      <div
        class="trending-header flex justify-between items-center mb-3 sm:mb-4"
      >
        <h3 class="font-semibold text-primary-custom text-base sm:text-lg">
          Famosos
        </h3>
      </div>
      <label [for]="'modal-1'" class="cursor-pointer">
      <div
        id="gridView"
        class="post-grid animate-slideUp"
        style="animation-delay: 0.6s"
      >

          <!-- Post 1 -->
          <div class="post-card" *ngFor="let celebrity of celebrityPosts">
            <img
              [src]="celebrity.image"
              alt="Post"
              class="post-card-img"
              (click)="openPostDetails(celebrity, $event)"
            />
            <div class="post-card-content">
              <div class="flex-between mb-2">
                <div class="flex-start gap-2">
                  <img
                    [src]="celebrity.avatar"
                    alt="Avatar"
                    class="w-6 h-6 rounded-full object-cover"
                  />
                  <p class="small-medium">{{ celebrity.author }}</p>
                </div>
                <span class="subtle-semibold text-light-3">6h</span>
              </div>
              <h4 class="base-semibold mb-1 truncate">
                {{ celebrity.text }}
              </h4>
              <div class="post-card-stats">
                <span class="flex-center gap-1 text-light-3">
                  <i class="far fa-heart"></i>
                  <small>{{ formatNumber(celebrity.likes) }}</small>
                </span>
                <span class="flex-center gap-1 text-light-3">
                  <i class="far fa-comment"></i>
                  <small>{{ formatNumber(celebrity.comments) }}</small>
                </span>
              </div>
            </div>
          </div>

      </div>
              </label>
    </div>
    <div>
      <div
        class="trending-header flex justify-between items-center mb-3 sm:mb-4"
      >
        <h3 class="font-semibold text-primary-custom text-base sm:text-lg">
          Quem você segue
        </h3>
      </div>
      <div id="listView" class="post-list hidden">
        <!-- List Item 1 -->
        <label [for]="'modal-1'" class="cursor-pointer">
        <div
          class="post-list-item"
          (click)="openPostDetails(followedPeople, $event)"
          *ngFor="let followedPeople of followedPeoplePosts; let i = index"
        >

          <img [src]="followedPeople.image" alt="Post" class="post-list-img" />
          <div class="post-list-content">
            <div>
              <div class="flex-between mb-2">
                <div class="flex-start gap-2">
                  <img
                    [src]="followedPeople.avatar"
                    alt="Avatar"
                    class="w-6 h-6 rounded-full object-cover"
                  />
                  <p class="small-medium">{{ followedPeople.author }}</p>
                </div>
                <span class="subtle-semibold text-light-3">6h</span>
              </div>
              <h4 class="base-semibold mb-1">
                {{ followedPeople.text }}
              </h4>
              <p class="small-medium text-light-3 mb-2 line-clamp-2">
                {{ followedPeople.tags }}
              </p>
            </div>
            <div class="flex-between">
              <div class="flex gap-3">
                <span class="flex-center gap-1 text-light-3">
                  <i class="far fa-heart"></i>
                  <small>{{ formatNumber(followedPeople.likes) }}</small>
                </span>
                <span class="flex-center gap-1 text-light-3">
                  <i class="far fa-comment"></i>
                  <small>{{ formatNumber(followedPeople.comments) }}</small>
                </span>
              </div>
              <i class="far fa-bookmark text-light-3"></i>
            </div>
          </div>
        </div>
        </label>
      </div>
    </div>
    <!-- Load More Button -->
    <button class="load-more-btn animate-slideUp" style="animation-delay: 0.7s">
      Carregar Mais
    </button>
  </div>
  <app-post-details
    [postSelected]="postSelected"
      [modalId]="'modal-1'"
  ></app-post-details>
</div>
