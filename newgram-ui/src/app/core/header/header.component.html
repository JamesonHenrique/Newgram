<header class="header-bar header-shadow z-10 bg-dark-2 sticky top-0">
  <div class="flex items-center justify-between p-4">
    <div>
      <a href="#" class="h3-bold text-primary-500 flex items-center">
        <img src="/images/logo.png" width="150" height="150" alt="Logo" />
      </a>
    </div>

    <div class="flex items-center space-x-6">
      <div class="relative">
        <button
          class="flex items-center space-x-2 focus:outline-none dropdown-toggle"
        >
          <div class=""  [routerLink]="['/perfil', usuarioLogado.username]">
            <img
              [src]="getFotoPerfil()"
              (error)="handleFotoPerfilError($event)"
              alt="Perfil do Usuário"
              class="w-14 h-14 rounded-full object-cover"
            />
          </div>
        </button>
      </div>
    </div>
  </div>
</header>
