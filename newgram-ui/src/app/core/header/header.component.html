<header class="header-bar header-shadow z-10 bg-dark-2 sticky top-0">
  <div class="flex items-center justify-between p-4">
    <div>
      <a href="#" class="h3-bold text-primary-500 flex items-center">
        <img src="/images/logo.png" width="150" height="150" alt="Logo" />
      </a>
    </div>

    <div class="flex items-center space-x-6">
      <div class="relative">
        <button
          type="button"
          (click)="alternarSino()"
          class="relative focus:outline-none"
          aria-label="Notificações"
        >
          <i class="fas fa-bell text-xl"></i>
          <span
            *ngIf="naoLidas > 0"
            class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full px-1.5 py-0.5"
          >
            {{ naoLidas > 99 ? '99+' : naoLidas }}
          </span>
        </button>
        <div
          *ngIf="sinoAberto"
          class="absolute right-0 mt-2 w-80 bg-dark-2 border border-gray-700 rounded-lg shadow-lg z-20 max-h-96 overflow-y-auto"
        >
          <div class="flex items-center justify-between p-3 border-b border-gray-700">
            <span class="font-semibold">Notificações</span>
            <button type="button" class="text-sm text-primary-500" (click)="marcarTodasComoLidas()">
              Marcar todas como lidas
            </button>
          </div>
          <div *ngIf="!notificacoes?.length" class="p-4 text-gray-500 text-sm">
            Nenhuma notificação.
          </div>
          <div
            *ngFor="let notificacao of notificacoes"
            (click)="marcarComoLida(notificacao)"
            class="p-3 border-b border-gray-800 cursor-pointer"
            [class.opacity-60]="notificacao.lida"
          >
            <p class="text-sm">{{ notificacao.conteudo }}</p>
            <span class="text-xs text-gray-500">{{ notificacao.tipo }}</span>
          </div>
        </div>
      </div>
      <div class="relative">
        <button
          class="flex items-center space-x-2 focus:outline-none dropdown-toggle"
        >
          <div class=""  [routerLink]="['/perfil', usuarioLogado.username]">
            <img
              [src]="getFotoPerfil()"
              (error)="handleFotoPerfilError($event)"
              alt="Perfil do Usuário"
              class="w-14 h-14 rounded-full object-cover"
            />
          </div>
        </button>
      </div>
    </div>
  </div>
</header>
