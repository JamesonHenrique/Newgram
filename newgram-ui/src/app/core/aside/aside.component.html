<div class="main-layout">
  <aside class="leftsidebar">
    <div class="flex flex-col gap-10">
      <a href="#" class="h3-bold text-primary-500 flex items-center">
        <img src="/images/logo.png" width="200" height="200" alt="Logo" />
      </a>

      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-4">
          <!-- Alterado para flex-row -->
          <img
            src="{{ user[0].image }}"
            width="70"
            height="70"
            alt="Perfil do Usuário"
            class="w-15 h-15 rounded-full object-cover"
          />
          <div class="flex flex-col">
            <!-- Container para o texto -->
            <h3 class="base-semibold">{{ user[0].name }}</h3>
            <p class="small-medium text-principal">&#64;{{ user[0].username }}</p>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex flex-col gap-2">
        <a href="#" class="leftsidebar-link base-medium bg-primary-custom">
          <i class="fas fa-home flex-center icon-custom w-5"></i>
          <span>Página Inicial</span>
        </a>
        <a href="#" class="leftsidebar-link base-medium">
          <i class="fas fa-compass flex-center icon-custom w-5"></i>
          <span>Explorar</span>
        </a>
        <a href="#" class="leftsidebar-link base-medium">
          <i class="fas fa-users flex-center icon-custom w-5"></i>
          <span>Pessoas</span>
        </a>
        <a href="#" class="leftsidebar-link base-medium">
          <i class="fas fa-bookmark flex-center icon-custom w-5"></i>
          <span>Salvos</span>
        </a>
        <a href="#" class="leftsidebar-link base-medium">
          <i class="fas fa-plus-circle flex-center icon-custom w-5"></i>
          <span>Criar Post</span>
        </a>
      </nav>
    </div>

    <!-- Logout Button -->
    <button class="leftsidebar-link base-medium mt-10">
      <i class="fas fa-sign-out-alt flex-center icon-custom w-5"></i>
      <span>Sair</span>
    </button>
  </aside>
  <div class="bottom-bar flex-between w-full px-5 py-4">
    <a href="#" class="flex-center flex-col gap-1">
      <i class="fas fa-home icon-custom text-xl"></i>
      <span class="tiny-medium">Início</span>
    </a>
    <a href="#" class="flex-center flex-col gap-1">
      <i class="fas fa-compass text-light-3 text-xl"></i>
      <span class="tiny-medium">Explorar</span>
    </a>
    <a href="#" class="flex-center flex-col gap-1">
      <i class="fas fa-plus-circle text-light-3 text-xl"></i>
      <span class="tiny-medium">Criar</span>
    </a>
    <a href="#" class="flex-center flex-col gap-1">
      <i class="fas fa-bookmark text-light-3 text-xl"></i>
      <span class="tiny-medium">Salvos</span>
    </a>
    <a href="#" class="flex-center flex-col gap-1">
      <i class="fas fa-users text-light-3 text-xl"></i>
      <span class="tiny-medium">Pessoas</span>
    </a>
  </div>
</div>
