<div class="main-layout custom-scrollbar">
  <!-- Left Sidebar -->

  <!-- Main Content Area -->
  <div class="content-area">
    <div class="create-post-container">
      <h1 class="h2-bold mb-6 text-center text-primary-500">Criar Novo Post</h1>

      <form id="createPostForm " [formGroup]="postForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">Foto</label>
          <div
            (click)="triggerFileInput()"
            id="image-upload-container"
            class="image-upload-container flex-center flex-col"
          >
            <input
              type="file"
              id="imageUpload"
              accept="image/*"
              #imageUpload
              (change)="previewSelectedImage($event)"
              style="display: none"
            />
            <img
              id="imagePreview"
              #imagePreview
              class="image-preview"
              [src]="selectedFoto"
              alt="Preview da imagem"
            />
            <div
              #uploadPlaceholder
              id="uploadPlaceholder"
              class="flex-center flex-col gap-3"
            >
              <i class="fas fa-cloud-upload-alt text-4xl text-light-3"></i>
              <p class="base-medium text-light-3">
                Clique para fazer upload ou arraste uma imagem
              </p>
              <p class="small-medium text-light-4">
                JPG, PNG ou GIF • Máximo 10MB
              </p>
            </div>
          </div>
        </div>

        <!-- Caption -->
        <div class="form-group">
          <label for="caption" class="form-label">Legenda</label>
          <textarea
            id="caption"
            class="form-input form-textarea custom-scrollbar"
            placeholder="Escreva uma legenda para seu post..."
            formControlName="legenda"
          ></textarea>
        </div>

        <!-- Location -->
        <div class="form-group">
          <label for="location" class="form-label">Localização</label>
          <div class="relative">
            <div class="flex items-center">
              <i class="fas fa-map-marker-alt icon-custom mr-2"></i>
              <input
                type="text"
                id="localizacao"
                class="form-input"
                placeholder="Adicione uma localização"
                formControlName="localizacao"
              />
            </div>
            <div
              id="locationSuggestions"
              class="location-suggestions custom-scrollbar"
            ></div>
          </div>
        </div>


        <div class="form-group">
          <label for="tagInput" class="form-label">Tags</label>
          <div class="tag-input-container">
            <div class="flex items-center">
              <i class="fas fa-hashtag icon-custom mr-2"></i>
              <input
                type="text"
                id="tagInput"
                class="form-input"
                placeholder="Adicione tags (pressione Enter para adicionar)"
                formControlName="hashtags"
              />
            </div>
            <div
              id="tagSuggestions"
              class="tag-suggestions custom-scrollbar"
            ></div>
          </div>
          <div
            id="tagsContainer"
            class="tags-container flex flex-wrap mt-2"
          ></div>
        </div>

        <div class="form-group">
          <label class="form-label">Tags Populares</label>
          <div class="flex flex-wrap gap-2 mt-2">
            <span
              *ngFor="let popularTag of popularTags"
              (click)="addPopularTag(popularTag.name)"
              class="tag px-3 py-1 bg-dark-3 rounded-full text-sm hover:bg-primary-custom transition cursor-pointer tag-suggestion"
            >
              #{{ popularTag.name }}
            </span>
          </div>
        </div>

        <div class="form-actions">
          <a href="index.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane mr-2"></i>
            Publicar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
